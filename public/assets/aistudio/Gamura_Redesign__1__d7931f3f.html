function edit(i){const k=i.t=='artboard'?'n':'text';ask(i.t=='artboard'?'Artboard name':'Edit text',i[k],s=>{if(s.trim()){snapshot();i[k]=s;fit(i);commit()}})}
const hex=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#000000',LN=i=>['line','arrow','path'].includes(i.t);
function ui(){$('#bs').classList.toggle('on',tool=='select');const bt=$('#bt');bt.classList.toggle('on',tool!='select');bt.textContent=(tool=='select'?'＋':TI[tool])+' ▾';
$('#pc').textContent=S.pages.length;$('#bp').classList.toggle('on',pOpen);
const i=by(sel),sb=$('#selbar');sb.style.display=i?'flex':'none';
if(i){const k=LN(i)?'stroke':'fill';sb.innerHTML=(i.t=='image'?'<button class="b" data-a="rep">🖼</button>':`<input type="color" value="${hex(i[k])}" data-k="${k}" aria-label="Color">`)+`<button class="b" data-a="dup">⧉</button><button class="b" data-a="fr">⬆</button>${i.t=='text'||i.t=='note'||i.t=='artboard'?'<button class="b" data-a="ed">Aa</button>':''}<button class="b" data-a="del">🗑</button>`}
document.body.classList.toggle('o',pOpen);if(pOpen)$('#pnl').innerHTML=pnlH()}
const rg=(l,k,mn,mx,st,val)=>`<div class="f"><label>${l}</label><input type="range" min="${mn}" max="${mx}" step="${st}" value="${val}" data-k="${k}"></div>`;
function pnlH(){const i=by(sel);let h=`<div class="tabs">${['Properties','Outline','Code','Tweaks'].map(t=>`<button class="b ${t==tab?'on':''}" data-a="tab" data-v="${t}">${t}</button>`).join('')}<button class="b" style="margin-left:auto" data-a="pc">✕</button></div><div class="bd">`;
if(tab=='Properties'){if(!i)h+='<p style="text-align:center;color:var(--mu);margin-top:40px">Nothing selected<br>Tap any element in the design to edit it here.</p>';else{
if(!LN(i)&&i.t!='image')h+=`<div class="f"><label>Fill</label><input type="color" value="${hex(i.fill)}" data-k="fill"></div>`;
if(i.t!='text'&&i.t!='note')h+=`<div class="f"><label>${LN(i)?'Color':'Stroke'}</label><input type="color" value="${hex(i.stroke)}" data-k="stroke"></div>`+rg('Width','sw',0,24,1,i.sw||0);
if(i.t=='rect'||i.t=='artboard'||i.t=='image')h+=rg('Radius','r',0,120,1,i.r||0);
if(i.t=='image')h+=rg('Brightness','br',.2,2,.05,i.br)+rg('Contrast','ct',.2,2,.05,i.ct)+rg('Saturation','sa',0,2,.05,i.sa)+rg('Blur','bl',0,12,.5,i.bl);
if(i.t=='text'||i.t=='note')h+=rg('Text size','fs',8,96,1,i.fs);
if(i.t=='text')h+=`<div class="f"><label>Bold</label><input type="checkbox" data-k="b" ${i.b?'checked':''}></div><div class="f"><label>Italic</label><input type="checkbox" data-k="it" ${i.it?'checked':''}></div><div class="f"><label>Font</label><select data-k="ff">${FF.map(([n,c])=>`<option value="${c}" ${i.ff==c?'selected':''}>${n}</option>`).join('')}</select></div>`;
h+=(i.t=='line'||i.t=='arrow'?'':rg('Rotate','rot',-180,180,1,i.rot||0))+rg('Opacity','op',.1,1,.05,i.op)+`<div class="f"><label>Shadow</label><input type="checkbox" data-k="sh" ${i.sh?'checked':''}></div><div class="ab">${i.t=='text'||i.t=='note'||i.t=='artboard'?'<button class="b" data-a="ed">Edit</button>':''}${i.t=='image'?'<button class="b" data-a="rep">Replace</button><button class="b" data-a="fm">Fit: '+FN[i.fm]+'</button><button class="b" data-a="rf">Reset filters</button>':''}<button class="b" data-a="dup">Duplicate</button><button class="b" data-a="fr">Front</button><button class="b" data-a="bk">Back</button><button class="b" data-a="del" style="color:#d93025">Delete</button></div>`}}
else if(tab=='Outline'){h+=[...I()].reverse().map(o=>`<div class="row ${o.id==sel?'s':''}" data-a="pick" data-v="${o.id}"><i>${o.t=='artboard'?'#':o.t=='text'?'T':'▪'}</i><div>${esc(o.t=='artboard'?o.n:o.t=='text'||o.t=='note'?o.text.slice(0,24):o.t)}</div></div>`).join('')||'<p>Empty page. Add a shape with the + button.</p>'}
else if(tab=='Code')h+=`<button class="bt" data-a="copy" style="margin:0 0 10px">Copy HTML</button><pre>${esc(htmlDoc().replace(/data:image[^"]+/g,'data:image...'))}</pre>`;
else h+=`<div class="row" data-a="gd"><i>${guides?'✓':''}</i>Layout guides</div><div class="row" data-a="sp"><i>${snap?'✓':''}</i>Snap to 8px grid</div><div class="row" data-a="fit"><i>⛶</i>Fit artboards</div>`;
return h+'</div>'}
function svgs(){const mkS=(x,y,w,h,L,bg)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} ${y} ${w} ${h}" width="${w}" height="${h}" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">${DEFS}${bg?`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff"/>`:''}${L.map(i=>shape(i,1)).join('')}</svg>`,A=I().filter(i=>i.t=='artboard');
if(A.length)return A.map(a=>({n:a.n,w:a.w,h:a.h,s:mkS(a.x,a.y,a.w,a.h,[a,...I().filter(o=>o.t!='artboard'&&inside(o,a))])}));
if(!I().length)return[];const b=bbox(I());return[{n:P().n,w:b.w+40,h:b.h+40,s:mkS(b.x-20,b.y-20,b.w+40,b.h+40,I(),1)}]}
const htmlDoc=()=>`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(S.name)}</title><style>body{margin:0;padding:24px;background:#eee;display:flex;flex-direction:column;align-items:center;gap:24px}svg{max-width:100%;height:auto;box-shadow:0 2px 12px #0003}@media print{body{background:#fff;padding:0}svg{box-shadow:none;break-after:page}}</style></head><body>\n${svgs().map(x=>x.s).join('\n')}\n</body></html>`;
function dl(n,u){try{const a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
const cp=()=>navigator.clipboard?.writeText(htmlDoc()).then(()=>toast('HTML copied'),()=>toast('Copy blocked by browser'));
function dup(){const i=by(sel);if(!i)return;snapshot();const c=JSON.parse(JSON.stringify(i));c.id=++S.id;c.x+=24;c.y+=24;if(c.n)c.n+=' copy';I().push(c);sel=c.id;commit()}
const A={tool:t=>{close();if(t=='image')return upl();tool=t;ui()},sel:()=>{tool='select';ui()},tools:()=>menu(TL.map(([n,ic,t])=>[ic,n,'tool',t])),
mn:()=>menu([['✎','Rename project','rn'],['⧉','Duplicate page','dpg'],['🧹','Clear page','clr','','x'],['＋','New project','np2','','x']]),
rn:()=>{close();ask('Project name',S.name,s=>{if(s.trim()){S.name=s.trim();$('#ttl').value=S.name;commit()}})},
dpg:()=>{snapshot();const p=JSON.parse(JSON.stringify(P()));p.n+=' copy';S.pages.push(p);S.pi=S.pages.length-1;sel=null;close();commit();fitV()},
clr:()=>{snapshot();P().items=[];sel=null;close();commit()},np2:()=>{S=null;seed();hist=[];sel=null;$('#ttl').value=S.name;close();commit();fitV()},
pages:()=>sheet(`<h3>Pages</h3>${S.pages.map((p,k)=>`<div class="row" data-a="gp" data-v="${k}"><i>${k==S.pi?'✓':''}</i><div style="flex:1">${esc(p.n)}</div><button class="b" data-a="rp" data-v="${k}">✎</button><button class="b" data-a="dp" data-v="${k}">🗑</button></div>`).join('')}<div class="row" data-a="np"><i>＋</i>New page</div>`),
gp:k=>{S.pi=+k;sel=null;close();commit();fitV()},np:()=>{snapshot();S.pages.push({n:'Page '+(S.pages.length+1),items:[],cm:[]});S.pi=S.pages.length-1;sel=null;close();commit()},
rp:k=>{close();ask('Rename page',S.pages[k].n,s=>{if(s.trim()){snapshot();S.pages[k].n=s.trim();commit()}})},
dp:k=>{if(S.pages.length<2)return toast('Keep at least one page');snapshot();S.pages.splice(+k,1);S.pi=0;sel=null;close();commit()},
zoom:()=>menu([['＋','Zoom in','zi'],['－','Zoom out','zo'],['⛶','Fit artboards','fit'],['◎','Zoom to selection','fs'],...[25,50,75,100,150,200].map(n=>['%',n+'%'+(Math.round(v.z*100)==n?' ✓':''),'zp',n]),['▦','Layout guides'+(guides?' ✓':''),'gd'],['↶','Undo','un'],['↷','Redo','re']]),
zi:()=>{const r=R();zoomAt(r.width/2,r.height/2,v.z*1.25);close()},zo:()=>{const r=R();zoomAt(r.width/2,r.height/2,v.z/1.25);close()},zp:n=>{const r=R();zoomAt(r.width/2,r.height/2,n/100);close()},
fit:()=>{close();fitV()},fs:()=>{close();fitV(1)},gd:()=>{guides=!guides;close();draw();ui()},sp:()=>{snap=!snap;ui()},un:()=>{close();undo()},re:()=>{close();redo()},
props:()=>{pOpen=!pOpen;ui()},pc:()=>{pOpen=false;ui()},tab:t=>{tab=t;ui()},pick:id=>{sel=+id;ui();draw()},
ok:()=>okf&&okf(),ed:()=>{const i=by(sel);if(i)edit(i)},dup,
fr:()=>{const i=by(sel);if(!i)return;snapshot();P().items=I().filter(o=>o!=i).concat(i);commit()},bk:()=>{const i=by(sel);if(!i)return;snapshot();P().items=[i].concat(I().filter(o=>o!=i));commit()},
del:()=>{if(!sel)return;snapshot();P().items=I().filter(o=>o.id!=sel);sel=null;commit()},
play:()=>{preview=true;sel=null;pOpen=false;document.body.classList.add('pv');ui();fitV()},xp:()=>{preview=false;document.body.classList.remove('pv');fitV()},
cm:()=>{const c=P().cm||(P().cm=[]);sheet(`<h3>Comments<button class="b" data-a="cma">＋</button></h3>${c.length?c.map(x=>`<div class="row"><i>💬</i><div>${esc(x)}</div></div>`).join(''):'<p style="text-align:center;color:var(--mu);padding:30px">No comments yet</p>'}`)},
cma:()=>ask('New comment','',s=>{if(s.trim()){(P().cm||(P().cm=[])).push(s.trim());save();A.cm()}}),
ex:()=>sheet('<h3>Export a copy</h3><div class="row" data-a="eh"><i>&lt;/&gt;</i><div>HTML<br><small>Standalone web page</small></div></div><div class="row" data-a="ep"><i>📕</i><div>PDF<br><small>Document for printing and sharing</small></div></div><div class="row" data-a="en"><i>🖼</i><div>PNG<br><small>Image of the first artboard</small></div></div><div class="row" data-a="copy"><i>⧉</i><div>Copy HTML code<br><small>If a download is blocked</small></div></div>'),
eh:()=>{dl((S.name||'design')+'.html',URL.createObjectURL(new Blob([htmlDoc()],{type:'text/html'})));cp();close()},copy:()=>{cp();close()},
ep:()=>{close();const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';f.srcdoc=htmlDoc();document.body.appendChild(f);f.onload=()=>{try{f.contentWindow.print()}catch(e){toast('Print blocked. Use HTML export.')}}},
en:()=>{const L=svgs();if(!L.length)return toast('Nothing to export');const x=L[0],im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=x.w*2;c.height=x.h*2;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);let u;try{u=c.toDataURL('image/png')}catch(e){return toast('PNG export failed')}dl(x.n+'.png',u);sheet(`<h3>PNG ready<button class="b" data-a="xc">✕</button></h3><img src="${u}" style="width:100%;border-radius:12px;border:1px solid var(--ln)"><p style="color:var(--mu)">Press and hold the image to save it.</p>`)};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x.s)},xc:close,img:()=>upl(),rep:()=>{const i=by(sel);if(i)upl(i)},fm:()=>{const i=by(sel),o=['xMidYMid slice','xMidYMid meet','none'];if(!i)return;snapshot();i.fm=o[(o.indexOf(i.fm)+1)%3];commit()},rf:()=>{const i=by(sel);if(!i)return;snapshot();Object.assign(i,{br:1,ct:1,sa:1,bl:0});commit()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
document.addEventListener('pointerdown',e=>{if(e.target.tagName=='INPUT'&&e.target.dataset.k&&sel)snapshot()});
document.addEventListener('input',e=>{const t=e.target,i=by(sel);if(!i||!t.dataset.k)return;const k=t.dataset.k;i[k]=t.type=='checkbox'?+t.checked:t.type=='color'||k=='ff'?t.value:+t.value;if(['fs','ff','b','it'].includes(k))fit(i);draw();save()});
$('#ttl').oninput=e=>{S.name=e.target.value;save()};
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key=='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(e.key=='Delete'||e.key=='Backspace')A.del();else if(e.key=='Escape'){sel=null;tool='select';ui();draw()}});
let rep=null;
function upl(r){rep=r||null;const f=$('#fi');f.value='';f.click()}
function addImg(f){if(!f||!f.type.startsWith('image/'))return toast('Choose an image file');const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const src=c.toDataURL(f.type=='image/png'?'image/png':'image/jpeg',.88);snapshot();
if(rep&&by(rep.id)){rep.src=src;rep.h=rep.w*c.height/c.width;sel=rep.id}else{const r=R(),w=Math.min(300,c.width),h=w*c.height/c.width,t=mk('image',(r.width/2-v.x)/v.z-w/2,(r.height/2-v.y)/v.z-h/2,w,h);t.src=src;I().push(t);sel=t.id}rep=null;commit();toast('Image added')};im.onerror=()=>toast('Could not read that image');im.src=fr.result};fr.readAsDataURL(f)}
$('#fi').onchange=e=>addImg(e.target.files[0]);
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();addImg(e.dataTransfer.files[0])});
addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith('image/'));if(f)addImg(f)});
$('#ttl').value=S.name;ui();draw();setTimeout(()=>fitV(),30);
</script></body></html>
